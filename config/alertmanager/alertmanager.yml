# Alertmanager 配置 - Quant 告警路由
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@quant.example.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'

# 模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 接收器
receivers:
  - name: 'default'
    email_configs:
      - to: 'oncall@quant.example.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#quant-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    webhook_configs:
      - url: 'http://quant-api:8521/webhooks/alertmanager'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: 'critical@quant.example.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#quant-critical'
        send_resolved: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        severity: critical

  - name: 'warning'
    email_configs:
      - to: 'warning@quant.example.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#quant-warnings'
        send_resolved: true

# 路由
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # 关键告警立即发送
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h

    # 警告级别
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 1m
      repeat_interval: 2h

    # 数据相关告警
    - match:
        category: data
      receiver: 'default'
      group_by: ['alertname', 'table']
      group_wait: 1m

    # 风控告警
    - match:
        category: risk
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 30m

# 抑制规则
inhibit_rules:
  # 如果有 critical 告警，抑制同服务的 warning
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'cluster']

  # 如果服务 down，抑制其所有子组件告警
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']
