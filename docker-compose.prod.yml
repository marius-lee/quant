# Quant 量化交易系统 - 生产环境 Docker Compose
# 启动: docker-compose -f docker-compose.prod.yml up -d
# 停止: docker-compose -f docker-compose.prod.yml down

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL - 元数据存储 (Dagster, 租户注册表, 审计日志)
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant} -d quant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # ═══════════════════════════════════════════════════════════════
  # Redis - 缓存、消息总线、分布式锁
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true

  # ═══════════════════════════════════════════════════════════════
  # MinIO - 对象存储 (因子缓存、模型文件、回测报告)
  # ═══════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: quant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true

  # ═══════════════════════════════════════════════════════════════
  # Dagster Webserver - 编排 UI
  # ═══════════════════════════════════════════════════════════════
  dagster-webserver:
    image: quant:latest
    container_name: quant-dagster-webserver
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
    environment:
      DAGSTER_HOME: /app/dagster_home
      POSTGRES_HOST: postgres
      POSTGRES_DB: quant
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dagster_home:/app/dagster_home
      - ./config/dagster:/app/dagster_home:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/dagster_home/logs

  # ═══════════════════════════════════════════════════════════════
  # Dagster Daemon - 后台调度器
  # ═══════════════════════════════════════════════════════════════
  dagster-daemon:
    image: quant:latest
    container_name: quant-dagster-daemon
    restart: unless-stopped
    command: ["dagster-daemon", "run"]
    environment:
      DAGSTER_HOME: /app/dagster_home
      POSTGRES_HOST: postgres
      POSTGRES_DB: quant
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dagster_home:/app/dagster_home
      - ./config/dagster:/app/dagster_home:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Quant Web API - 统一 API 网关
  # ═══════════════════════════════════════════════════════════════
  quant-api:
    image: quant:latest
    container_name: quant-api
    restart: unless-stopped
    command: ["python", "-m", "quant.web.app"]
    environment:
      QUANT_CONFIG_PATH: /config/config.yaml
      QUANT_DATA_DIR: /data
      QUANT_LOG_DIR: /logs
      POSTGRES_HOST: postgres
      POSTGRES_DB: quant
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DAGSTER_HOST: dagster-webserver
      DAGSTER_PORT: 3000
    volumes:
      - ./config:/config:ro
      - quant_data:/data
      - quant_logs:/logs
    ports:
      - "8521:8521"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8521/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - quant-internal
      - quant-external
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /logs

  # ═══════════════════════════════════════════════════════════════
  # Factor Worker - 分布式因子计算工作节点 (可横向扩展)
  # ═══════════════════════════════════════════════════════════════
  factor-worker:
    image: quant:latest
    container_name: quant-factor-worker
    restart: unless-stopped
    command: ["python", "-m", "quant.factor.distributed.worker"]
    environment:
      QUANT_CONFIG_PATH: /config/config.yaml
      QUANT_DATA_DIR: /data
      QUANT_LOG_DIR: /logs
      RAY_ADDRESS: ray-head:10001
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./config:/config:ro
      - quant_data:/data
      - quant_logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Ray Head - Ray 集群头节点
  # ═══════════════════════════════════════════════════════════════
  ray-head:
    image: rayproject/ray:2.9.0-py312
    container_name: quant-ray-head
    restart: unless-stopped
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--dashboard-port=8265", "--num-cpus=4", "--num-gpus=0"]
    ports:
      - "6379:6379"
      - "8265:8265"
      - "10001:10001"
    volumes:
      - ray_data:/tmp/ray
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - quant-internal
    security_opt:
      - no-new-privileges:true

  # ═══════════════════════════════════════════════════════════════
  # Prometheus - 指标收集
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: quant-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - quant-internal
      - quant-monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Grafana - 可视化大盘
  # ═══════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.2.0
    container_name: quant-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - quant-internal
      - quant-monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Alertmanager - 告警管理
  # ═══════════════════════════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: quant-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=120d'
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - quant-monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Loki - 日志聚合
  # ═══════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:2.9.0
    container_name: quant-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - quant-monitoring
    security_opt:
      - no-new-privileges:true

  # ══════════════════════════════════════════════════════════════
  # Promtail - 日志采集
  # ═══════════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:2.9.0
    container_name: quant-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - quant_logs:/logs:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - quant-monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # Tempo - 分布式追踪
  # ═══════════════════════════════════════════════════════════════
  tempo:
    image: grafana/tempo:2.3.0
    container_name: quant-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./config/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/tempo
    ports:
      - "3200:3200"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - quant-monitoring
    security_opt:
      - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# 卷定义
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  dagster_home:
    driver: local
  quant_data:
    driver: local
  quant_logs:
    driver: local
  ray_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local

# ═══════════════════════════════════════════════════════════════
# 网络定义
# ═══════════════════════════════════════════════════════════════
networks:
  quant-internal:
    driver: bridge
    internal: true  # 仅内部通信
  quant-external:
    driver: bridge
  quant-monitoring:
    driver: bridge
    internal: true
