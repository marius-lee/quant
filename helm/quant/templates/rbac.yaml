apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quant.fullname" . }}-api
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quant.fullname" . }}-dagster
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quant.fullname" . }}-factor
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
---
# RBAC 权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quant.fullname" . }}-api
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quant.fullname" . }}-api
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quant.fullname" . }}-api
    namespace: {{ include "quant.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "quant.fullname" . }}-api
  apiGroup: rbac.authorization.k8s.io
---
# Factor Worker 需要管理 Ray Job
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quant.fullname" . }}-factor
  labels:
    {{- include "quant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quant.fullname" . }}-factor
  labels:
    {{- include "quant.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quant.fullname" . }}-factor
    namespace: {{ include "quant.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "quant.fullname" . }}-factor
  apiGroup: rbac.authorization.k8s.io
