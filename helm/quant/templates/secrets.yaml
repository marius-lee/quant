apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.quant.config.secret }}
  namespace: {{ include "quant.namespace" . }}
  labels:
    {{- include "quant.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 数据源 API Keys - 由 CI/CD 注入
  TUSHARE_TOKEN: ""
  # 其他敏感配置
  JWT_SECRET_KEY: ""
  ENCRYPTION_KEY: ""
