[project]
name = "quant"
version = "1.0.0"
description = "A-share quantitative trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "optuna>=3.0",
    "hmmlearn>=0.2",
    "sqlalchemy>=2.0",
    "duckdb>=0.9",
    "redis>=4.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "prometheus-client>=0.17",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrument>=0.40",
    "opentelemetry-exporter-otlp>=1.20",
    "grafana-client>=0.1",
    "click>=8.1",
    "tqdm>=4.65",
    "pyarrow>=12.0",
    "polars>=0.18",
    "akshare>=1.9",
    "baostock>=1.0",
    "tushare>=1.3",
    "requests>=2.31",
    "aiohttp>=3.8",
    "tenacity>=8.2",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.3",
    "black>=23.0",
    "isort>=5.12",
]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
]
benchmark = [
    "pytest-benchmark>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PYI"]
ignore = ["E501", "B008", "C408", "T201", "T203"]
per-file-ignores = { "test/*" = { S101 = true, T201 = true, T203 = true }, "scripts/*" = { S101 = true, T201 = true } }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.coverage.run]
source = ["quant"]
omit = ["test/*", "scripts/*", "web/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
