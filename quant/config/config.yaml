    main_st: 0.05
    chinext: 0.2
    star: 0.2
    beijing: 0.3
  limit_detection_margin: 0.005
  huanfang:
    turnover_vol_window: 20
    mif_window: 20
    taccel_short: 5
    taccel_long: 20
    idio_vol_window: 60
    vp_div_window: 20
  bb:
    window: 20
    width_multiplier: 2.0
    squeeze_lookback: 125
