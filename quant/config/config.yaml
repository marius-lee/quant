# quant — A股量化选股系统 配置文件 (单一真相源)
# 所有参数均有文献或业界依据, 详见行内注释与底部来源对照表。
# ADR-041: 参数全面对齐业界标准 (2026-07-28, test-v281 恢复+更新)

# quant — A股量化选股系统 配置文件 (单一真相源)
# 所有参数均有文献或业界依据, 详见行内注释与底部来源对照表。
# ADR-041: 参数全面对齐业界标准 (2026-07-28, test-v281 恢复+更新)

alpha:
  lgb:
    train:
      start_date: '2015-01-01'
      test_start: '2024-01-01'
      forward_horizon: 5
      cv_folds: 5
      train_chunk_samples: 4_000_000   # 来源: 2026-07-30 OOM 实测, MacBook 16GB, 4M×75×float32≈1.2GB/批安全
    predict:
      fallback: ic_weighted
    params:
      objective: regression
      metric: rmse
      boosting_type: gbdt
      num_leaves: 31
      learning_rate: 0.05
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      n_estimators: 200
      min_data_in_leaf: 20
      max_depth: 6
      lambda_l1: 0.1
      lambda_l2: 0.1
  xgb:
    train:
      start_date: '2015-01-01'
      forward_horizon: 5
      train_chunk_samples: 4_000_000   # 来源: 复用 lgb 实测值, xgb 内存占用相近
    predict:
      fallback: ic_weighted
    params:
      objective: reg:squarederror
      booster: gbtree
      n_estimators: 200
      learning_rate: 0.01              # 来源: 量化常用低学习率, 配合早停防过拟合
      max_depth: 5                     # 来源: 量化树深 3-6, 防噪音学习
      subsample: 0.8                   # 来源: 行采样 0.7-0.8
      colsample_bytree: 0.8            # 来源: 列采样 0.7-0.8
      reg_lambda: 1.0                  # 来源: L2 正则, 量化第一要务 (1-10)
      reg_alpha: 0.1                   # 来源: L1 正则辅助
      min_child_weight: 20             # 来源: 等价 lgb min_data_in_leaf
      early_stopping_rounds: 20        # 来源: 早停, 未提供 eval_set 时内部忽略
  combine_mode: sleeve
  intersection_primary: gap_5d
  intersection_top_fraction: 0.2
  method: ic_weighted
  retrain_freq: 60
  weekly_weight: 0.3
  sector_rotation: true
  sleeve:
    min_factors: 1
    positions_per_factor: 20
  top_fraction: 0.08
  train_window: 500
  sigmoid_steepness: 10
  regime_combine: true
  multi_tf_confirm: false
attribution:
  ic_rolling_window: 60
  ic_degradation_threshold: 0.3
  monitoring_buffer_days: 20
  promotion_stability_days: 10
  dsr_degraded_threshold: 0.5
  dsr_recover_threshold: 0.95
  cpcv_min_days: 40
  cpcv_lookback_days: 120
  ic_daily_retention_days: 252
  annual_periods: 252
  risk_free_rate: 0.02
  corr_redundant_threshold: 0.7
  oos_warning_decay: 0.5
  oos_recovery_threshold: 1.5
  tier_nano_cap: 50000        # 来源: test-v284, 精简模式 AUM 上限
  tier_micro_cap: 500000      # 来源: test-v284, 标准模式 AUM 上限
  turnover_limit_nano: 999.0  # 来源: test-v284, Nano层不限换手
  turnover_limit_micro: 2.0   # 来源: test-v284, Micro层200%阈值
  turnover_limit_small: 0.5   # 来源: test-v284, Small层50%阈值
  slippage_limit_nano: 0.05   # 来源: test-v284, Nano层5%滑点
  slippage_limit_micro: 0.02  # 来源: test-v284, Micro层2%滑点
  slippage_limit_small: 0.01  # 来源: test-v284, Small层1%滑点
oos_verify:
  train_window_days: 170
  test_window_days: 20
  decay_warn_threshold: 0.5
  min_ic_obs: 20
  min_total_points: 10
  min_is_points: 20
  min_oos_points: 5
  sample_interval: 3
  attribution_n_symbols: 300
  backtest_n_symbols: 0
backtest:
  benchmark: '000300'
  default_capital: 5000
  default_end: '2026-06-30'
  default_start: '2020-01-01'
  lot_size: 100
  min_backtest_days: 250
  rebalance_interval_days: 5
  universe_size: 800
  universe_turnover_days: 7
  diagnosis_ic_window: 180
  progress_log_interval: 60
  min_trading_days: 10
  factor_cache_max_days: 2000
  universe_filter_affordable: true
  smoke:
    universe_size: 10
    start: '2026-06-24'
    end: '2026-07-24'
  factor_cache_start: '2019-01-01'
cache: null
calendar:
  max_lookup_days: 30
benchmark:
  start_date: '2025-12-01'
data:
  batch_size: 50
  derived_ratio_max: 100
  gap_fill_limit: 100
  lookback_days: 365
  pe_max: 200
  stale_days: 250
  start_date: '2020-01-01'
  benchmark_start_date: '2020-01-01'
  tushare_token: ${TUSHARE_TOKEN}
  tickflow_api_key: ${TICKFLOW_API_KEY}
  rate_limit:
    tushare_batch_sec: 1.2
    tushare_calls_per_minute: 50
    akshare_calls_per_minute: 60
    tickflow_batch_sec: 1.5
    tickflow_quote_batch_sec: 6
