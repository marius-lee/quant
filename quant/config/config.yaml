    - tushare
    - tencent
    - akshare
    - sina
    - pytdx
    max_requests_per_source_per_run: 500
    curl_impersonate: chrome131
  fetch:
    max_lookback_days: 2000
  http_timeout:
    sina: 10
    tushare: 10
    tencent: 15
    sse: 20
  pytdx:
    connect_timeout: 10
    sse: 20
  api_delay:
    fund_hold: 2
    margin: 4
    margin_page: 5
    limit_up: 0.3
    holder_trade: 0.3
    lhb: 0.5
    jq_valuation: 0.15
    em_valuation: 0.5
    fund_flow: 5.0
    dividend: 0.2
    daily_basic: 0.1
    northbound: 0.3
  sqlite:
    timeout: 30
    busy_timeout: 30000
execution:
  broker:
    adapter: simulated
    vnpy:
      gateway: CtpGateway
      settings:
        username: ''
        password: ''
        broker_id: ''
        td_address: ''
        md_address: ''
        product_info: ''
        auth_code: ''
        app_id: ''
  commission: 0.0003
  min_commission: 5
  slippage: 0.001
  impact_eta: 0.1
  default_impact_bps: 5
  default_daily_vol: 0.02
  stamp_tax: 0.0005
  quote:
    max_batch_workers: 4
  limit_order:
    discount_pct: 0.002
    runaway_start: 0.03
    runaway_end: 0.005
    volume_limit_pct: 0.01
    force_fill_time: '14:50'
    quote_ttl_sec: 30
  price_buffer: 0.05
factor:
  accruals:
    max: 1
    min: -1
  amihud:
    min_valid_days: 30
    min_valid_ratio: 0.5
    scale: 1000000
  compute:
    winsorize_pct: 0.01
    earnings_decay_lambda: 0.0077
    zscore_min_count_dense: 30
    zscore_min_count_sparse: 10
    # v365: 物化性能参数
    cache_compresslevel: 1               # gzip 压缩级别 (1=快/大, 6=慢/小, M1 Max实测级别1快3x)
    cache_worker_threshold: 50           # 因子数超此阈值时 max_workers 4→2 (防 OOM)
    cache_checkpoint_ttl_sec: 86400      # 断点有效期 (24h), 超时视为过期
    # v363: Alpha 冗余检测
    redundancy_corr_threshold: 0.7        # 因子对相关系数超此值视为冗余 (WorldQuant 标准)
  debt_ratio:
    max: 2
    min: 0
  decay_horizons:
  - 1
  - 5
  - 20
  enable_quality: false
  evaluation:
    backtest_start_date: '2010-01-01'
    cpcv_groups: 5
    cpcv_test_groups: 1
    embargo_days: 5
    lookback: 252
    max_workers: 4
    worker_timeout_sec: 300
    min_abs_ic: 0.02
    min_half_life: 20
    min_icir: 0.25
    monitoring_min_icir: 0.20            # 来源: test-v285, probation参与信号后从0.15→0.20 (Grinold & Kahn IR≥0.25=弱, 观察池向下取0.20)
    monitoring_min_abs_ic: 0.015         # 来源: test-v285, probation参与信号后从0.01→0.015 (IC=0.01无经济意义, Qlib标准≥0.02)
    max_retries: 3
    diagnostics_min_icir: 0.20            # 来源: test-v285, 与 monitoring_min_icir 对齐 (原本 0.15)
    diagnostics_pnl_threshold: 0.1
    diagnostics_review_threshold: -0.5
    n_days: 252
    n_symbols: 800
    net_sharpe_min: 0.3
    pbo_max: 0.2
    sharpe_decay_max: 0.5
    t_threshold: 2.0
    max_lag: 20
    n_quantiles: 5
  high52w:
    clip_high: 2
    clip_low: -2
  idio_vol:
    min_common_obs: 10
  roe_ratio:
    max: 100
    min: 0
  roe_reported:
    max: 1
    min: -1
  stats:
